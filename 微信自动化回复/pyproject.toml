[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-agent"
version = "0.1.0"
description = "Enterprise WeChat agent service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "redis",
    "python-dotenv",
    "structlog",
    "wechatpy[cryptography]==1.8.18",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.0",
]

[project.optional-dependencies]
assistant = [
    "pypdf==6.10.0",
    "openpyxl==3.1.5",
]
dev = [
    "fakeredis",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
wecom-agent-local = "agent_loop:main"
wecom-agent-ui = "src.core.assistant.web:main"

[tool.setuptools]
py-modules = ["agent_loop"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "adapters", "adapters.*", "prompts", "smoke", "smoke.*"]

[tool.setuptools.package-data]
prompts = ["*.txt"]
adapters = ["*.applescript"]
"src.core.assistant" = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.ruff]
target-version = "py311"
